<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vaultly - Password Manager</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="card" id="card">
    <h1>Vaultly</h1>

    <!-- Screen 1: first-time setup -->
    <section id="setup-screen" hidden>
      <p class="hint">Create a master password. It encrypts everything in your vault and is never stored. If you forget it, your data cannot be recovered.</p>
      <form id="setup-form">
        <label for="setup-password">Master password</label>
        <input id="setup-password" type="password" minlength="10" autocomplete="new-password" required>
        <label for="setup-confirm">Confirm master password</label>
        <input id="setup-confirm" type="password" autocomplete="new-password" required>
        <p class="error" id="setup-error" role="alert"></p>
        <button type="submit">Create vault</button>
      </form>
    </section>

    <!-- Screen 2: unlock -->
    <section id="unlock-screen" hidden>
      <p class="notice" id="lock-notice" role="status" hidden></p>
      <p class="hint">Enter your master password to unlock your vault.</p>
      <form id="unlock-form">
        <label for="unlock-password">Master password</label>
        <input id="unlock-password" type="password" autocomplete="current-password" required>
        <p class="error" id="unlock-error" role="alert"></p>
        <button type="submit">Unlock</button>
      </form>
      <button type="button" id="erase-btn" class="link-btn">Erase vault and start over</button>
    </section>

    <!-- Screen 3: vault -->
    <section id="vault-screen" hidden>
      <div class="vault-header">
        <h2>Your vault</h2>
        <div class="header-controls">
          <label for="autolock-select">Auto-lock after</label>
          <select id="autolock-select">
            <option value="1">1 minute</option>
            <option value="2">2 minutes</option>
            <option value="5">5 minutes</option>
            <option value="10">10 minutes</option>
            <option value="15">15 minutes</option>
            <option value="30">30 minutes</option>
          </select>
          <button type="button" id="lock-btn" class="secondary">Lock vault</button>
        </div>
      </div>

      <div class="toolbar">
        <input id="search" type="search" placeholder="Search title, username, website or category" aria-label="Search entries">
        <button type="button" id="add-btn">Add entry</button>
      </div>

      <form id="entry-form" hidden>
        <input type="hidden" id="entry-id">

        <label for="entry-title">Title</label>
        <input id="entry-title" type="text" placeholder="For example: Gmail" required>

        <label for="entry-username">Username or email</label>
        <input id="entry-username" type="text" autocomplete="off">

        <label for="entry-password">Password</label>
        <input id="entry-password" type="password" autocomplete="new-password" required>
        <label class="inline-check">
          <input type="checkbox" id="entry-show"> Show password
        </label>

        <div class="strength" aria-live="polite">
          <div class="strength-bar"><div id="strength-fill" class="strength-fill"></div></div>
          <span id="strength-label" class="strength-label"></span>
        </div>

        <details class="generator">
          <summary>Password generator</summary>
          <div class="gen-body">
            <label for="gen-length">Length: <output id="gen-length-value">16</output></label>
            <input type="range" id="gen-length" min="8" max="64" value="16">
            <label class="inline-check"><input type="checkbox" id="gen-lower" checked> Lowercase letters (a-z)</label>
            <label class="inline-check"><input type="checkbox" id="gen-upper" checked> Uppercase letters (A-Z)</label>
            <label class="inline-check"><input type="checkbox" id="gen-numbers" checked> Numbers (0-9)</label>
            <label class="inline-check"><input type="checkbox" id="gen-symbols" checked> Symbols (!@#$...)</label>
            <p class="error" id="gen-error" role="alert"></p>
            <button type="button" id="gen-btn">Generate password</button>
          </div>
        </details>

        <label for="entry-url">Website</label>
        <input id="entry-url" type="text" placeholder="https://example.com">

        <label for="entry-category">Category</label>
        <select id="entry-category">
          <option>Email</option>
          <option>Social</option>
          <option>Banking</option>
          <option>Shopping</option>
          <option>Work</option>
          <option>Apps</option>
          <option>Other</option>
        </select>

        <label for="entry-notes">Notes</label>
        <textarea id="entry-notes" rows="3"></textarea>

        <div class="form-actions">
          <button type="submit">Save entry</button>
          <button type="button" id="cancel-btn" class="secondary">Cancel</button>
        </div>
      </form>

      <p id="empty-msg" class="hint" hidden></p>
      <ul id="entry-list" class="entry-list"></ul>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
